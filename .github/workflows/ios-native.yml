name: Build iOS MemoryCore

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Native/**"
      - "App/**"
      - "Core/**"
      - "UI/**"
      - "iOSMemoryInspector.xcodeproj/**"
      - "CMakeLists.txt"
      - "Tests/**"
      - ".github/workflows/ios-native.yml"

permissions:
  contents: read

jobs:
  build-ios-xcframework:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build iPhone device library
        run: |
          mkdir -p build/ios build/ios-simulator
          xcrun --sdk iphoneos clang++ \
            -std=c++20 -stdlib=libc++ -dynamiclib -arch arm64 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 \
            -fvisibility=hidden -Wall -Wextra -Wpedantic \
            -I Native Native/MemoryCore.cpp \
            -Wl,-install_name,@rpath/libmemorycore.dylib \
            -o build/ios/libmemorycore.dylib

      - name: Build iOS Simulator library
        run: |
          xcrun --sdk iphonesimulator clang++ \
            -std=c++20 -stdlib=libc++ -dynamiclib -arch arm64 -arch x86_64 \
            -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -mios-simulator-version-min=15.0 \
            -fvisibility=hidden -Wall -Wextra -Wpedantic \
            -I Native Native/MemoryCore.cpp \
            -Wl,-install_name,@rpath/libmemorycore.dylib \
            -o build/ios-simulator/libmemorycore.dylib

      - name: Package XCFramework
        run: |
          mkdir -p build/include
          cp Native/MemoryCore.h build/include/MemoryCore.h
          xcodebuild -create-xcframework \
            -library build/ios/libmemorycore.dylib \
            -headers build/include \
            -library build/ios-simulator/libmemorycore.dylib \
            -headers build/include \
            -output build/MemoryCore.xcframework

      - name: Build unsigned iPhone Simulator app
        run: |
          xcodebuild \
            -project iOSMemoryInspector.xcodeproj \
            -scheme MemoryInspector \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -f build/derived/Build/Products/Release-iphonesimulator/MemoryInspector.app/Frameworks/libmemorycore.dylib
          xcrun --sdk iphonesimulator otool -L \
            build/derived/Build/Products/Release-iphonesimulator/MemoryInspector.app/MemoryInspector \
            | grep -q '@rpath/libmemorycore.dylib'
          ditto -c -k --sequesterRsrc --keepParent \
            build/derived/Build/Products/Release-iphonesimulator/MemoryInspector.app \
            build/MemoryInspector-iOS-Simulator.zip

      - name: Launch app in iOS Simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("SimRuntime.iOS")) | .value[] | select(.isAvailable)] | first | .udid')"
          test -n "$DEVICE_ID"
          DEVICE_STATE="$(xcrun simctl list devices available --json | jq -r --arg id "$DEVICE_ID" '[.devices[][] | select(.udid == $id)][0].state')"
          if [ "$DEVICE_STATE" != "Booted" ]; then
            xcrun simctl boot "$DEVICE_ID"
          fi
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" \
            build/derived/Build/Products/Release-iphonesimulator/MemoryInspector.app
          LAUNCH_RESULT="$(xcrun simctl launch "$DEVICE_ID" com.secretboy767.MemoryInspector)"
          echo "$LAUNCH_RESULT"
          [[ "$LAUNCH_RESULT" == *"com.secretboy767.MemoryInspector"* ]]

      - name: Build unsigned iPhone device app
        run: |
          xcodebuild \
            -project iOSMemoryInspector.xcodeproj \
            -scheme MemoryInspector \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived-device \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -f build/derived-device/Build/Products/Release-iphoneos/MemoryInspector.app/Frameworks/libmemorycore.dylib
          xcrun --sdk iphoneos otool -L \
            build/derived-device/Build/Products/Release-iphoneos/MemoryInspector.app/MemoryInspector \
            | grep -q '@rpath/libmemorycore.dylib'
          ditto -c -k --sequesterRsrc --keepParent \
            build/derived-device/Build/Products/Release-iphoneos/MemoryInspector.app \
            build/MemoryInspector-iOS-Device-unsigned.zip
          mkdir -p build/ipa/Payload
          cp -R build/derived-device/Build/Products/Release-iphoneos/MemoryInspector.app \
            build/ipa/Payload/MemoryInspector.app
          (cd build/ipa && /usr/bin/zip -qry ../MemoryInspector-iOS-unsigned.ipa Payload)
          /usr/bin/unzip -Z -1 build/MemoryInspector-iOS-unsigned.ipa \
            | grep -q '^Payload/MemoryInspector.app/Info.plist$'
          /usr/bin/unzip -Z -1 build/MemoryInspector-iOS-unsigned.ipa \
            | grep -q '^Payload/MemoryInspector.app/Frameworks/libmemorycore.dylib$'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            build/ipa/Payload/MemoryInspector.app/Info.plist

      - name: Upload iOS library artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoryCore-iOS-XCFramework
          path: build/MemoryCore.xcframework
          if-no-files-found: error

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: MemoryInspector-iOS-Simulator
          path: build/MemoryInspector-iOS-Simulator.zip
          if-no-files-found: error

      - name: Upload unsigned iPhone app
        uses: actions/upload-artifact@v4
        with:
          name: MemoryInspector-iOS-Device-unsigned
          path: build/MemoryInspector-iOS-Device-unsigned.zip
          if-no-files-found: error

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MemoryInspector-iOS-unsigned-IPA
          path: build/MemoryInspector-iOS-unsigned.ipa
          if-no-files-found: error
